name: Deploy

on: 
  push:
    branches: ["master"]

jobs:
  build:


    runs-on: ubuntu-latest

    steps: 
    - uses: actions/checkout@v4
    - run: docker build . -t swapnildevops/actions_java
    - run: echo "${{secrets.DOCKERHUB_PASSWORD}}" | docker login -u {{secrets.DOCKERHUB_USERNAME}} --password-stdin
    - run: docker push swapnildevops/actions_java:latest


